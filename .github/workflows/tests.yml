name: Test sn-cli

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
jobs:
  test:
    # Keyed by branch and platform: a new run supersedes that branch's own
    # earlier run, and branches do not cancel each other. These tests run
    # offline (the live ones are opt-in via SN_INTEGRATION_TESTS), so there is
    # no shared account to serialise against.
    #
    # The matrix leg has to be in the key. This block is per job, so without it
    # the three platforms share one group and, now that they run in parallel,
    # cancel each other as they start.
    concurrency:
      group: test-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      -
        # Live-server tests are opt-in via SN_INTEGRATION_TESTS; CI runs the
        # offline unit tests only so it does not create items on a real
        # account. Set that variable here to run the full suite.
        name: Tests
        run: |
          go mod tidy
          go test -cover -v -failfast -p 1 ./... -coverprofile cover.out
        if: runner.os != 'Windows'
        env:
          SN_SERVER: ${{ secrets.SN_SERVER }}
          SN_EMAIL: ${{ secrets.SN_EMAIL }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
      -
        name: Codacy Coverage Reporter
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          coverage-reports: cover.out
          force-coverage-parser: go
        # Uploading coverage is best-effort. Dependabot pull requests run
        # without repository secrets, so CODACY_PROJECT_TOKEN is empty there
        # and the action fails; that should not turn a passing test run red.
        continue-on-error: true
        if: runner.os != 'Windows'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      -
        name: Windows Tests
        run: |
          go mod tidy
          go test -v -failfast -p 1 ./...
        if: runner.os == 'Windows'
        env:
          SN_SERVER: ${{ secrets.SN_SERVER }}
          SN_EMAIL: ${{ secrets.SN_EMAIL }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
